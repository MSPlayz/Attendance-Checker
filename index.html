
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Library QR Attendance System</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #1f2937;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 22px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    button, select {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      background: #2563eb;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #64748b;
    }

    .exit-button {
      background: #dc2626;
    }

    .panel {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .hidden {
      display: none;
    }

    .student-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .detail {
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .note {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Library Attendance</h1>
    <p class="subtitle">Scan your student QR code to begin.</p>

    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">
      Start QR Scanner
    </button>

    <div id="studentPanel" class="panel hidden">
      <div id="studentName" class="student-name"></div>
      <div id="studentDetails"></div>
    </div>

    <div id="areaPanel" class="panel hidden">
      <h3>Choose Your Library Area</h3>
      <p>Select the area where you will stay.</p>

      <select id="areaSelect">
        <option value="">-- Select an area --</option>
        <option value="Interactive Area">Interactive Area</option>
        <option value="Reading Area">Reading Area</option>
        <option value="Discussion Room">Discussion Room</option>
      </select>

      <button id="entryButton" onclick="confirmEntry()">
        Confirm Entry
      </button>

      <button class="secondary" onclick="cancelAction()">
        Cancel
      </button>
    </div>

    <div id="exitPanel" class="panel hidden">
      <h3>Active Library Visit</h3>
      <p id="activeVisit"></p>
      <p>Are you leaving the library now?</p>

      <button id="exitButton" class="exit-button"
              onclick="confirmExit()">
        Record Exit
      </button>

      <button class="secondary" onclick="cancelAction()">
        Cancel
      </button>
    </div>

    <div id="status" role="status" aria-live="polite">
      Ready to scan.
    </div>

    <p class="note">
      Allow camera access when prompted. If the scanner stops,
      select Start QR Scanner to try again.
    </p>
  </main>

  <script>
    // IMPORTANT: Replace this with your current Apps Script Web App URL.
    const GAS_URL =
      "PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE";

    const scanner = new Html5Qrcode("reader");

    let currentStudentId = "";
    let currentStudent = null;
    let busy = false;

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function show(id) {
      document.getElementById(id).classList.remove("hidden");
    }

    function hide(id) {
      document.getElementById(id).classList.add("hidden");
    }

    function hidePanels() {
      hide("studentPanel");
      hide("areaPanel");
      hide("exitPanel");
    }

    function displayStudent(student) {
      currentStudent = student;

      const middle = student.middleInitial
        ? " " + student.middleInitial
        : "";

      document.getElementById("studentName").textContent =
        student.firstName + middle + " " + student.lastName;

      const details = document.getElementById("studentDetails");
      details.replaceChildren();

      const values = [
        ["Student ID", student.studentId],
        ["Section", student.section],
        ["Gender", student.gender]
      ];

      values.forEach(function(item) {
        const line = document.createElement("p");
        line.className = "detail";
        line.textContent = item[0] + ": " + (item[1] || "Not provided");
        details.appendChild(line);
      });

      show("studentPanel");
    }

    // Uses JSONP so GitHub Pages can communicate with Apps Script.
    function requestAppsScript(action, extraParams = {}) {
      return new Promise(function(resolve, reject) {
        if (GAS_URL.includes("PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE")) {
          reject(new Error("Please set your Apps Script Web App URL."));
          return;
        }

        const callbackName =
          "libraryCallback_" + Date.now() + "_" +
          Math.floor(Math.random() * 1000000);

        const params = new URLSearchParams({
          action: action,
          scan: currentStudentId,
          callback: callbackName,
          ...extraParams
        });

        const script = document.createElement("script");
        let finished = false;

        function cleanup() {
          delete window[callbackName];
          script.remove();
          clearTimeout(timeout);
        }

        function fail(error) {
          if (finished) return;
          finished = true;
          cleanup();
          reject(error);
        }

        const timeout = setTimeout(function() {
          fail(new Error(
            "The request timed out. Check the Web App URL and deployment access."
          ));
        }, 15000);

        window[callbackName] = function(result) {
          if (finished) return;
          finished = true;
          cleanup();

          if (!result || !result.success) {
            reject(new Error(
              result && result.message
                ? result.message
                : "The server returned an invalid response."
            ));
            return;
          }

          resolve(result);
        };

        script.onerror = function() {
          fail(new Error(
            "Connection failed. Check the Web App URL and deployment permissions."
          ));
        };

        script.src = GAS_URL + "?" + params.toString();
        document.body.appendChild(script);
      });
    }

    async function startCamera() {
      if (busy || scanner.isScanning) return;

      hidePanels();
      document.getElementById("startButton").disabled = true;
      setStatus("Starting camera...");

      try {
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          onQrScanned,
          function() {
            // Ignore ordinary frames that do not contain a QR code.
          }
        );

        setStatus("Camera ready. Scan your student QR code.");
      } catch (error) {
        setStatus(
          "Could not start camera. Allow camera access and use HTTPS. " +
          (error.message || "")
        );
      } finally {
        document.getElementById("startButton").disabled = false;
      }
    }

    async function stopCamera() {
      if (scanner.isScanning) {
        try {
          await scanner.stop();
        } catch (error) {
          console.error("Camera stop error:", error);
        }
      }
    }

    async function onQrScanned(decodedText) {
      if (busy) return;

      busy = true;
      currentStudentId = String(decodedText).trim();

      await stopCamera();
      hidePanels();
      setStatus("Checking student ID...");

      try {
        const result = await requestAppsScript("lookup");
        displayStudent(result.student);

        if (result.checkedIn) {
          document.getElementById("activeVisit").textContent =
            "Selected area: " + (result.area || "Not specified");

          show("exitPanel");
          setStatus("Student is currently checked in.");
        } else {
          document.getElementById("areaSelect").value = "";
          show("areaPanel");
          setStatus("Choose your library area to record entry.");
        }
      } catch (error) {
        setStatus(error.message);
        busy = false;
        document.getElementById("startButton").textContent =
          "Try Scanning Again";
      }
    }

    async function confirmEntry() {
      const area = document.getElementById("areaSelect").value;

      if (!currentStudentId || !currentStudent) {
        setStatus("Please scan your student QR code first.");
        return;
      }

      if (!area) {
        setStatus("Please select a library area.");
        return;
      }

      document.getElementById("entryButton").disabled = true;
      setStatus("Recording entry...");

      try {
        const result = await requestAppsScript("entry", { area: area });

        hidePanels();
        setStatus(
          result.message + " Area: " + result.area +
          ". Time: " + result.time
        );

        finishAndReset();
      } catch (error) {
        setStatus(error.message);
      } finally {
        document.getElementById("entryButton").disabled = false;
      }
    }

    async function confirmExit() {
      if (!currentStudentId) {
        setStatus("Please scan your student QR code first.");
        return;
      }

      document.getElementById("exitButton").disabled = true;
      setStatus("Recording exit...");

      try {
        const result = await requestAppsScript("exit");

        hidePanels();
        setStatus(
          result.message + " Area: " + result.area +
          ". Time: " + result.time
        );

        finishAndReset();
      } catch (error) {
        setStatus(error.message);
      } finally {
        document.getElementById("exitButton").disabled = false;
      }
    }

    function cancelAction() {
      hidePanels();
      currentStudentId = "";
      currentStudent = null;
      busy = false;
      setStatus("Cancelled. Start the scanner when ready.");
    }

    function finishAndReset() {
      currentStudentId = "";
      currentStudent = null;
      busy = false;
      document.getElementById("startButton").textContent =
        "Scan Next Student";
    }
  </script>
</body>
</html>
